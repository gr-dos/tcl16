name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # make fetches the pinned libc16 release (scripts/fetch-libc16) and
      # the Open Watcom snapshot it names; the snapshot is cached per pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tools
          key: libc16-tools-ubuntu-24.04-${{ hashFiles('scripts/fetch-libc16') }}

      # M2's candidate, the Tcl 6.7 DOS port, is fetched from SourceForge
      # rather than vendored (scripts/fetch-tcl67); the archives are
      # cached per pin.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/tcl67/download
          key: tcl67-download-${{ hashFiles('scripts/fetch-tcl67') }}

      - name: Install DOSBox-X, patch and gcc-multilib
        run: |
          sudo apt-get update
          sudo apt-get install -y dosbox-x patch gcc-multilib

      - name: Check the vendored Tiny Tcl source
        run: make check-vendor

      # build/dev/TCL.EXE, linked with libc16 and libkitchen16: what a
      # release publishes as tcl.exe (release.yml).
      - name: Build
        run: make

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tcl.exe
          path: build/dev/TCL.EXE

      - name: Test (DOSBox-X, 8086)
        run: make test

      - name: Test (host reference build)
        run: make test-host

      # Tcl 6.7's own test suite, from the M2 download, with Tiny Tcl;
      # failures not in tests/suite/tinytcl.baseline fail the build.
      - name: Test (Tcl 6.7 suite)
        run: make test-suite

      - name: libc16 build experiment
        run: |
          make libc16-try

      # M2: the Tcl 6.7 DOS port (docs/M2-REPORT.md), also an evaluation
      # binary, not uploaded.
      - name: Build (Tcl 6.7 DOS port)
        run: make tcl67

      - name: Test (Tcl 6.7 DOS port, DOSBox-X, 8086)
        run: make test-tcl67

      - name: Test (Tcl 6.7 DOS port, Tcl 6.7 suite)
        run: make test-suite-tcl67

      - name: libc16 build experiment (Tcl 6.7 DOS port)
        run: make libc16-try-tcl67
